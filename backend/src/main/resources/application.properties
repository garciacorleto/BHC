
# ==========================================
# BHC - CONFIGURACIÓN DEL BACKEND
# ==========================================

# Nombre de la aplicación Spring Boot.
spring.application.name=backend


# ==========================================
# BASE DE DATOS H2
# ==========================================

# Base de datos H2 almacenada en archivos.
# La ruta es relativa al directorio desde el que se ejecuta el backend.
# Los datos permanecen guardados después de reiniciar la aplicación.
spring.datasource.url=jdbc:h2:file:./data/bhc

# Driver JDBC utilizado para conectar con H2.
spring.datasource.driver-class-name=org.h2.Driver

# Credenciales de la base de datos local de desarrollo.
spring.datasource.username=sa
spring.datasource.password=


# ==========================================
# JPA / HIBERNATE
# ==========================================

# Actualiza el esquema de la base de datos según las entidades JPA.
# Conserva los datos existentes, pero no sustituye a las migraciones
# controladas que necesitaríamos en producción.
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola las consultas SQL ejecutadas por Hibernate.
# Útil para aprender y depurar durante el desarrollo.
spring.jpa.show-sql=true
